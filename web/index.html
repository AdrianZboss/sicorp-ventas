<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SICORP Ventas Web</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;--blue:#1764c0}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{max-width:920px;margin:auto;padding:24px}section{border:1px solid #8994a455;border-radius:18px;padding:20px;margin:16px 0}h1,h2,p{margin:0 0 14px}label{display:block;margin:12px 0 6px}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #8994a477}input,select{max-width:100%}button{cursor:pointer}button.primary{color:white;background:var(--blue);border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}#login{max-width:440px;margin:10vh auto}#password,#search{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.product{padding:12px 0;border-bottom:1px solid #8994a444}.variant{display:flex;align-items:center;gap:8px;margin:8px 0}.variant span{flex:1}.variant input{width:76px}.muted{opacity:.75;font-size:.9rem}#message{white-space:pre-wrap}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.sale{padding:10px 0;border-bottom:1px solid #8994a444}[hidden]{display:none!important}
</style></head><body><main><header><h1>SICORP Ventas</h1><button id="logout" hidden>Cerrar sesión</button></header><p id="message" role="status"></p>
<section id="login"><h2>Acceso privado</h2><p class="muted">Ingresa tu clave maestra. No se guarda en este navegador.</p><form id="loginForm"><label for="password">Clave maestra</label><input type="password" id="password" autocomplete="off" required><p><button class="primary" type="submit">Acceder</button></p></form></section>
<div id="dashboard" hidden><section><h2>Registrar ventas</h2><label for="store">Tienda</label><select id="store"><option>De Prati Rotonda</option><option>Pycca Rotonda</option><option>DormiLeón</option><option>El Bosque – Las Aguas</option><option>Zona Muebles Garzota</option></select><label for="search">Buscar producto</label><input id="search" type="search" placeholder="Ej. Hotel Soft, Aloe Vera"><div id="products"></div><div class="row spread"><p id="count">0 unidades</p><button class="primary" id="save">Registrar ventas</button></div></section>
<section><div class="row spread"><h2>Historial en la nube</h2><button id="reload">Actualizar</button></div><div id="history"></div></section>
<section><h2>Evidencias privadas</h2><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><button id="upload">Subir archivo</button><p class="muted">Hasta 10 MB por archivo. No se generan enlaces públicos.</p><div id="files"></div></section></div>
</main><script type="module" src="./app.js"></script></body></html>
