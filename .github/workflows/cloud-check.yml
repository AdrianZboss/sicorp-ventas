name: Verificar SICORP Cloud
on:
  push:
    branches: [sicorp-web-cloud, sicorp-offline-test, sicorp-report-inspect]
    paths:
      - 'app/**'
      - 'web/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/cloud-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspectar estructura de reportes
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          s=re.sub(r'data:image/[^"\x27\s]+','[imagen]',s)
          for pattern in [r'<[^>]*id=["\x27](report|store|copy|share)[^>]*>',r'function\s+(\w*report\w*|label|fmtDay|render|list|persist)\s*\(',r'\b(?:const|let|var)\s+\w*(?:report|store|tienda)\w*\s*=',r'\$\(["\x27](report|copy|share|store)["\x27]\)']:
              for m in list(re.finditer(pattern,s,re.I))[:50]:
                  print(m.group(0),s[max(0,m.start()-200):m.end()+1300])
          PY
      - name: Verificar JavaScript
        run: |
          node --check app/src/main/assets/cloud.js
          node --check app/src/main/assets/simple-ui.js
          node --check app/src/main/assets/theme.js
          node --check web/boot.js
          node --check sw.js
          node - <<'JS'
          const fs=require('fs'), assert=require('assert');
          const c=fs.readFileSync('app/src/main/assets/cloud.js','utf8');
          const code=c.slice(c.indexOf('const clone='),c.indexOf('let meta='));
          const {merge}=new Function('catalog',code+';return {merge};')([{id:'17',variants:[{}]}]);
          const r=q=>q?{'2026-11-27':[{id:'17',v:0,q}]}:{};
          assert.equal(merge(r(2),r(3),r(4),false).records['2026-11-27'][0].q,5);
          assert.equal(merge(r(5),r(2),r(8),false).conflicts.length,1);
          assert.equal(merge({},r(2),r(3),true).conflicts.length,1);
          JS
      - name: Probar interfaz web original y acceso privado
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/sicorp-http.log 2>&1 &
          node - <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const viewport of [{width:390,height:844},{width:1366,height:768}]){
                const page=await browser.newPage({viewport});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://localhost:8765/web/',{waitUntil:'load'});
                const frame=page.frameLocator('#app');
                await frame.locator('#sicorp-cloud-login[open]').waitFor({timeout:20000});
                assert.equal(await frame.locator('#sicorp-modern-ui').count(),1);
                assert.equal(await frame.locator('#sicorp-theme-style').count(),1);
                assert.equal(await frame.locator('#grid').count(),1);
                assert.equal(await frame.locator('#sicorp-cloud-login input[type=password]').count(),1);
                const key=frame.locator('#sicorp-login-key');
                const urls=await frame.locator('script[src]').evaluateAll(nodes=>nodes.map(n=>n.src));
                assert.ok(urls.some(u=>u.includes('/cloud.js?v=')));
                assert.ok((await page.locator('#app').getAttribute('src')).includes('index.html?v='));
                assert.equal(await key.getAttribute('inputmode'),'numeric');
                assert.equal(await key.getAttribute('enterkeyhint'),'go');
                await key.fill('012345');
                assert.equal(await key.inputValue(),'012345');
                await frame.getByRole('button',{name:'Cambiar a teclado completo'}).click();
                assert.equal(await key.getAttribute('inputmode'),'text');
                assert.equal(await key.getAttribute('type'),'password');
                await frame.getByRole('button',{name:'Cambiar a teclado numérico'}).click();
                assert.equal(await key.getAttribute('inputmode'),'numeric');
                assert.equal(await key.inputValue(),'012345');
                await key.fill('');
                assert.equal(await frame.getByText('Continuar sin conexión',{exact:true}).isVisible(),false);
                assert.equal(await frame.locator('#sicorp-trusted-device').isChecked(),false);
                await page.keyboard.press('Escape');
                assert.equal(await frame.locator('#sicorp-cloud-login[open]').count(),1);
                assert.deepEqual(errors,[]);
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node tests/offline-account.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4.0.3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compilar sin publicar
        run: |
          gradle --no-daemon :app:assembleRelease
